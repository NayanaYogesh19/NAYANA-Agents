<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GA4 + GSC Analytics Agent
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fraunces:wght@700;800;900&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <!-- Atmosphere background -->
    <div class="atmosphere"></div>

    <div class="app-outer">

        <div class="app-shell glass-panel">

            <!-- Sidebar -->
            <nav class="sidebar">

                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </div>

                <div class="sidebar-item active" title="Analytics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                </div>

                <div class="sidebar-item" title="GA4 Reports">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </div>

                <div class="sidebar-item" title="Search Console">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </div>

                <div class="sidebar-item" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/>
                    </svg>
                </div>

            </nav>

            <!-- Main content -->
            <div class="app-content">

                <!-- Topbar -->
                <div class="topbar">

                    <div class="topbar-left">
                        <span class="topbar-eyebrow">Analytics Dashboard</span>
                        <h1 class="topbar-title">GA4 + GSC Agent</h1>
                    </div>

                    <div class="topbar-right">

                        <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"/>
                                <line x1="12" y1="1" x2="12" y2="3"/>
                                <line x1="12" y1="21" x2="12" y2="23"/>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                <line x1="1" y1="12" x2="3" y2="12"/>
                                <line x1="21" y1="12" x2="23" y2="12"/>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                        </button>

                        <div class="topbar-badge">
                            <span class="badge-dot"></span>
                            Analytics Agent
                        </div>

                        <div class="topbar-avatar">
                            GA
                        </div>

                    </div>

                </div>

                <!-- App main scroll area -->
                <main class="app-main page-enter">

                    <!-- Module & Report Selection -->
                    <section class="glass-card-static selection-card">

                        <div class="card-header">
                            <span class="section-eyebrow">Configuration</span>
                            <h2 class="card-title">Select Report</h2>
                        </div>

                        <div class="selection-grid">

                            <div class="form-group">
                                <label class="field-label">Module</label>
                                <div class="select-wrapper">
                                    <select id="module" class="glass-select">
                                        <option value="">Select Module</option>
                                        <option value="ga4">GA4 — Google Analytics 4</option>
                                        <option value="gsc">GSC — Google Search Console</option>
                                    </select>
                                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"/>
                                    </svg>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="field-label">Report</label>
                                <div class="select-wrapper">
                                    <select id="report" class="glass-select">
                                        <option value="">Select Report</option>
                                    </select>
                                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"/>
                                    </svg>
                                </div>
                            </div>

                        </div>

                    </section>

                    <!-- Dynamic Inputs -->
                    <section id="inputSection" class="glass-card-static input-card">

                        <div class="card-header">
                            <span class="section-eyebrow">Parameters</span>
                            <h2 class="card-title">Input Parameters</h2>
                        </div>

                        <div id="dynamicInputs" class="dynamic-inputs"></div>

                    </section>

                    <!-- Buttons -->
                    <section class="button-section">

                        <button id="runBtn" class="btn-brand">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            Run Report
                        </button>

                        <button id="resetBtn" class="btn-secondary-glass">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="1 4 1 10 7 10"/>
                                <path d="M3.51 15a9 9 0 1 0 .49-3.52"/>
                            </svg>
                            Start Over
                        </button>

                    </section>

                    <!-- Loading -->
                    <section id="loadingSection" class="loading-section" style="display:none;">

                        <div class="glass-card-static loading-card">
                            <div class="loader"></div>
                            <p class="loading-text">Fetching data...</p>
                        </div>

                    </section>

                    <!-- Output -->
                    <section id="outputSection" class="glass-card-static output-card">

                        <div class="card-header">
                            <span class="section-eyebrow">Results</span>
                            <h2 class="card-title">Generated Report</h2>
                        </div>

                        <div id="reportOutput">
                            <div class="placeholder">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="placeholder-icon">
                                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                                    <path d="M3 9h18M9 21V9"/>
                                </svg>
                                <p>Select a report and click <strong>Run Report</strong> to get started</p>
                            </div>
                        </div>

                    </section>

                </main>

            </div>

        </div>

    </div>

    <script src="/static/scripts.js?v=3"></script>

    <script>
        // Theme toggle — pure UI, no logic change
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') html.setAttribute('data-theme', 'dark');

        themeToggle.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>

</body>

</html>
